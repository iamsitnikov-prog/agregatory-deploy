name: Выкладка agregatory.pro на reg.ru

# Отдельный репозиторий выкладки: платформа poehali.dev его не трогает.
# Каждые 30 минут забирает код сайта из iamsitnikov-prog/food-delivery-site-10,
# собирает, подкладывает проверенный .htaccess из этого репозитория
# и выкладывает на хостинг reg.ru. Если с прошлой выкладки ничего
# не изменилось — ничего не делает.
#
# Settings -> Secrets and variables -> Actions
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR
#   Variables: SITE_URL — адрес для проверки после выкладки
#                (до переезда http://agregatory.pro, после — https://agregatory.pro)
#              SITE_IP  — IP хостинга (37.140.192.35), только ДО переключения DNS:
#                проверка пойдёт прямо на reg.ru, минуя старый сервер.
#                После переключения DNS переменную удалить.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  actions: write   # только чтобы GitHub не выключил расписание через 60 дней

concurrency:
  group: deploy-regru
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Забираем настройки выкладки (.htaccess)
        uses: actions/checkout@v4
        with:
          path: deploy

      - name: Забираем код сайта
        uses: actions/checkout@v4
        with:
          repository: iamsitnikov-prog/food-delivery-site-10
          path: site

      - name: Что выкладываем
        id: ver
        # Дата (UTC, как в пререндере) в ключе: раз в сутки сайт пересобирается даже без изменений
        # кода — так статьи с будущей датой публикуются сами в свой день.
        run: echo "key=$(git -C site rev-parse HEAD)-$(git -C deploy rev-parse HEAD)-$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Выкладывали ли уже эту версию
        id: last
        uses: actions/cache/restore@v4
        with:
          path: .deployed
          key: deployed-${{ steps.ver.outputs.key }}
          lookup-only: true

      - name: Изменений нет — выходим
        if: steps.last.outputs.cache-hit == 'true' && github.event_name == 'schedule'
        run: echo "Эта версия уже на хостинге, пропускаю."

      - name: Ставим Node
        if: steps.last.outputs.cache-hit != 'true' || github.event_name != 'schedule'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Собираем сайт
        if: steps.last.outputs.cache-hit != 'true' || github.event_name != 'schedule'
        working-directory: site
        run: |
          npm install --no-audit --no-fund
          npm run build
          cp ../deploy/htaccess dist/.htaccess

      - name: Приём заявок на нашем хостинге (api/lead.php)
        if: steps.last.outputs.cache-hit != 'true' || github.event_name != 'schedule'
        # Токены берутся из секретов GitHub и попадают только в api/config.php
        # на хостинге (снаружи закрыт в .htaccess). В репозитории их нет.
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LEAD_EMAIL_TO: ${{ secrets.LEAD_EMAIL_TO }}
        run: |
          mkdir -p site/dist/api
          cp deploy/api/lead.php site/dist/api/lead.php
          cp deploy/api/report.php site/dist/api/report.php
          cp deploy/api/reactions.php site/dist/api/reactions.php
          cp deploy/api/reactions-seed.json site/dist/api/reactions-seed.json
          php -r 'echo "<?php\nreturn " . var_export([
            "tg_token" => getenv("TG_BOT_TOKEN") ?: "",
            "tg_chat"  => getenv("TG_CHAT_ID") ?: "",
            "email_to" => getenv("LEAD_EMAIL_TO") ?: "",
          ], true) . ";\n";' > site/dist/api/config.php
          php -l site/dist/api/lead.php
          php -l site/dist/api/config.php
          php -l site/dist/api/reactions.php
          # Форма сайта: вместо функции poehali.dev шлём заявки на свой обработчик.
          OLD='https://functions.poehali.dev/3df83e5c-d49d-4a84-8862-107cedfd17f0'
          files=$(grep -rlF "$OLD" site/dist --include='*.js' || true)
          if [ -n "$files" ]; then
            echo "$files" | xargs sed -i "s#$OLD#/api/lead.php#g"
            echo "Форма переключена на /api/lead.php: $(echo "$files" | wc -l) файл(ов)"
            # Скрипты кэшируются браузером на год по имени файла — изменённым
            # даём новое имя и правим ссылки на них, иначе постоянные посетители
            # продолжат слать заявки по старому адресу.
            for f in $files; do
              base=$(basename "$f" .js); new="${base}-l"
              mv "$f" "$(dirname "$f")/${new}.js"
              grep -rlF "${base}.js" site/dist --include='*.html' --include='*.js' --include='*.css' \
                | xargs -r sed -i "s#${base}\.js#${new}.js#g"
              echo "Переименован: ${base}.js → ${new}.js"
            done
          else
            echo "Форма уже шлёт заявки на /api/lead.php прямо из кода сайта"
          fi
          # Отметки «Полезно» в блоге: тоже на свой хостинг (если в коде остался старый адрес).
          OLDR='https://functions.poehali.dev/5384928e-d232-4529-9e00-cfdcc6458060'
          { grep -rlF "$OLDR" site/dist --include="*.js" || true; } | xargs -r sed -i "s#$OLDR#/api/reactions.php#g"
          # Сайт не должен обращаться к poehali.dev ни за чем.
          if grep -rlF "poehali.dev" site/dist --include='*.js' --include='*.html'; then
            echo "В сборке остались обращения к poehali.dev — выкладку отменяю"; exit 1
          fi
          ! grep -rqF "$OLD" site/dist --include='*.js' || { echo "Остались старые адреса формы"; exit 1; }
          [ -n "$TG_BOT_TOKEN" ] && echo "Telegram: настроен" || echo "Telegram: секреты не заданы, заявки идут на почту"

      - name: Проверяем, что сборка полная
        if: steps.last.outputs.cache-hit != 'true' || github.event_name != 'schedule'
        working-directory: site
        run: |
          for f in index.html 404.html sitemap.xml robots.txt .htaccess api/lead.php api/report.php api/config.php api/reactions.php; do
            test -f "dist/$f" || { echo "Нет dist/$f — выкладку отменяю"; exit 1; }
          done
          grep -q "DirectorySlash Off" dist/.htaccess || { echo ".htaccess не тот — отменяю"; exit 1; }
          pages=$(find dist -name index.html | wc -l)
          echo "Страниц в сборке: $pages"
          test "$pages" -gt 200 || { echo "Мало страниц ($pages) — пререндер отвалился, выкладку отменяю"; exit 1; }

      - name: Выкладываем на reg.ru
        if: steps.last.outputs.cache-hit != 'true' || github.event_name != 'schedule'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: ./site/dist/
          protocol: ftps
          dangerous-clean-slate: false

      - name: Проверяем сайт на хостинге
        if: (steps.last.outputs.cache-hit != 'true' || github.event_name != 'schedule') && vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_IP: ${{ vars.SITE_IP }}
        run: bash deploy/check.sh

      - name: Запоминаем выложенную версию
        if: steps.last.outputs.cache-hit != 'true'
        run: mkdir -p .deployed && echo "${{ steps.ver.outputs.key }}" > .deployed/key

      - name: Сохраняем отметку
        if: steps.last.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deployed
          key: deployed-${{ steps.ver.outputs.key }}

      - name: Не даём GitHub выключить расписание
        if: always()
        uses: liskin/gh-workflow-keepalive@v1
