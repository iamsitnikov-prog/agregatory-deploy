name: Утренний отчёт в рабочую группу (без Claude)

# Цифры за вчера из Яндекс Метрики и Вебмастера по API (секрет YANDEX_TOKEN,
# действует до мая 2027), сайт, оплата и SSL. Отправка ботом @Claudesitnikov_bot.
# Юрий утвердил 8.11.2026: каждый день в рабочую группу, к 9:00 МСК.
# Ручной запуск с галочкой test шлёт пробный выпуск Юрию в личку.

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Пробный выпуск Юрию в личку вместо группы"
        type: boolean
        default: true
  schedule:
    - cron: '25 5 * * *'   # 8:25 МСК, GitHub иногда задерживает запуск на 10–20 минут

permissions:
  contents: read
  actions: write   # только чтобы GitHub не выключил расписание через 60 дней

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
      BOT: ${{ secrets.CLAUDE_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Собираем и отправляем
        run: |
          [ -n "$YANDEX_TOKEN" ] || { echo "::error::нет секрета YANDEX_TOKEN"; exit 1; }
          python3 scripts/morning-report.py report.html
          CHAT=-5022978987
          [ "${{ inputs.test }}" = "true" ] && CHAT=979925834
          r=$(curl -sS -m 30 "https://api.telegram.org/bot${BOT}/sendMessage" --data-urlencode chat_id=$CHAT \
               --data-urlencode parse_mode=HTML --data-urlencode disable_web_page_preview=true --data-urlencode "text@report.html")
          echo "$r" | grep -q '"ok":true' && echo "::notice::отправлено в $CHAT" || { echo "::error::Telegram: $r"; exit 1; }

      - name: Не даём GitHub выключить расписание
        if: always()
        uses: liskin/gh-workflow-keepalive@v1
