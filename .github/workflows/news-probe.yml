name: Проверка источников новостей

# Ручная диагностика для дайджеста «Внутри Еды»: какие ленты СМИ и Telegram каналы
# открываются с серверов GitHub и сколько в них свежих новостей по теме доставки.
# Ничего не меняет. Actions → «Проверка источников новостей» → Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Проверка
        run: python3 scripts/news-probe.py scripts/news-sources.json | tee probe.txt
      - name: Сохранить результат в ветку news-probe-result
        run: |
          mkdir /tmp/r && cp probe.txt news-probe.json /tmp/r/ && cd /tmp/r
          git init -q -b news-probe-result && git add . && git -c user.name=bot -c user.email=bot@local commit -qm "Результат проверки источников"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" news-probe-result
